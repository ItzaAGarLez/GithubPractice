<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI TIENDA</title>
</head>
<body>
<h1>Bienvenido a MI TIENDA ONLINE</h1>
<nav>
    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="contacto.html">Contacto</a></li>

    </ul>
</nav>
<header>
    <main></main>
    <section>
        <h2>FORMULARIO DE REGISTRO</h2>
        <p>Regístrate ahora y recibe nuestras últimas novedades y ofertas especiales.</p>
        <form action="registro.html" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Tu email" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            <button type="submit">Registrarse</button>
            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            <legend>Al registrarte, aceptas nuestros <a href="terminos.html">términos y condiciones</a>.</legend>
            <label for="terminos">
                <input type="checkbox" id="terminos" name="terminos" required>
                Acepto los términos y condiciones
            </label>
        </form>
    </section>
   
</html>
